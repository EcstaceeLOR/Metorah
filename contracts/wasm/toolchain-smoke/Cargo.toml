[package]
name = "metorah-toolchain-smoke"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compiler-validation ink! fixture only; NOT a migration ledger"

[dependencies]
ink = { version = "=5.1.1", default-features = false }

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["ink/std"]
ink-as-dependency = []
