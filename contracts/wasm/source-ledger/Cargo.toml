[package]
name = "metorah-source-ledger"
version = "0.1.0"
edition = "2021"
publish = false
description = "Metorah WASM fungible source ledger, pending runtime qualification and audit"

[dependencies]
ink = { version = "=5.1.1", default-features = false }

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["ink/std"]
ink-as-dependency = []
