name: Metorah validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build
      - run: forge test -vvv
  local-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r local_model/requirements.txt
      - run: python -m unittest discover -s local_model -v
      - run: cd local_model && python run_experiment.py
